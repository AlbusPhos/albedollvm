[package]
name = "albedollvm"
version = "0.1.0"
edition = "2024"


[lib]
crate-type = ["cdylib"]


[dependencies]
llvm-pass = { version = "0.3.1", features = ["inkwell"]}
lib-unknown = { version = "0.5.0", features = ["default"]}
rustc-demangle = "0.1"
regex = "1"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
toml = "1"