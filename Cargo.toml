
[package]
name = "albedollvm"
version = "0.1.0"
edition = "2024"
authors = ["AlbusPhos <owo.zzz@proton.me>"]
license = "MPL-2.0"
readme = "README.md"
keywords = ["llvm", "hardening", "obfuscation", "rust"]


[lib]
crate-type = ["cdylib"]


[dependencies]
llvm-pass = { version = "0.3.1", features = ["inkwell"]}
lib-unknown = { version = "0.5.0", features = ["default"]}
rustc-demangle = "0.1"
regex = "1"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
toml = "1"
symbolic-demangle = "13.9.0"
symbolic-common = "13.9.0"
dashmap = "6"
rustc-hash = "2"
base64 = "0.23"
memchr = "2"


[profile.release]
debug = 0
lto = true
codegen-units = 1
