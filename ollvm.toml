[rust_remove_panic]
enabled = true
mode = "trap"
exit_code = 101

[remove_leak]
enabled = true
enable_builtins = true

[[remove_leak.rules]]
name = "InternalSecretKey"
min_len = 24
max_len = 256
substrings = ["sk-live-", "sk-test-"]
regex = '(sk-(?:live|test)-[0-9a-zA-Z]{16,64})'

[[target_func.rules]]
func = "mix64"
path = ["demo"]
pass = ["pass2", "pass3"]  # 对该函数应用这两个pass
exclude = false            # 控制是排除还是启用

[[target_func.rules]]
path = ["lib_unknown", "core"]
# 空pass表示应用全部pass

[[target_func.rules]]
func = "rpp64"
path = ["lib_unknown", "core"]
pass = ["pass3"]
exclude = true             # 在 core 中单独为 rpp64 排除 pass3

[target_func.pass1]        # 对其他未明确选择的函数按概率启用该pass
other_pct = 10             # 0..=100

[target_func.pass2]
other_pct = 0

[target_func.pass4]
other_pct = 100